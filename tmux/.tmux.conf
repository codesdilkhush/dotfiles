# ── GENERAL ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -ga terminal-features ",xterm-kitty:hyperlinks"
set -gq extended-keys on
set -ga terminal-features "xterm-kitty:extkeys"
set -g allow-passthrough on

set -g mouse on
set -g set-clipboard on
set -g status-interval 3
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 10000
set -g focus-events on

# ── INDEXING ─────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── PREFIX ───────────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── RELOAD ───────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── SESSIONS ─────────────────────────────────────────────────────────────────
bind S choose-session                            # pick session interactively
bind X confirm-before -p "kill session? (y/n)" kill-session

# ── WINDOWS ──────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"      # new window (current path)
bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind , command-prompt "rename-window '%%'"       # rename window

# ── SPLITS ───────────────────────────────────────────────────────────────────
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}" # vertical split
bind - split-window -v -c "#{pane_current_path}" # horizontal split

# ── PANE NAVIGATION (vim-style) ──────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z                            # toggle zoom

# ── PANE RESIZE ──────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── COPY MODE (vi) ───────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi q   send -X cancel

# ── PLUGINS ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
