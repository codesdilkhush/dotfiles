# PERFORMANCE
enable_gpu             yes
sync_to_monitor        yes
input_delay            0
repaint_delay          8

scrollback_lines                50000
scrollback_pager_history_size   50

# FONT
font_family      JetBrains Mono
font_size        12.0

disable_ligatures never

# Nerd font symbol fallback
symbol_map U+E000-U+F8FF JetBrainsMono Nerd Font

# TERMINAL + NVIM SUPPORT
term             xterm-kitty
shell_integration enabled

clipboard_control write-clipboard write-primary read-clipboard read-primary

# TOKYO NIGHT COLORS
background  #1a1b26
foreground  #a9b1d6

cursor        #7aa2f7
cursor_shape  block
cursor_blink  yes

selection_foreground #ffffff
selection_background #414868

color0  #414868
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# WINDOW / UI
hide_window_decorations   yes
remember_window_size      yes
window_padding_width      12
window_padding_height     12
background_opacity        0.90
dynamic_background_opacity yes
background_blur           20
enable_tab_bar            no

# BELL
enable_audio_bell    no
visual_bell_duration 0.0

# WAYLAND
focus_follows_mouse no
mouse_hide_wait     1.5

# REMOTE CONTROL
allow_remote_control yes
listen_on            unix:/tmp/kitty

# QUALITY OF LIFE
confirm_os_window_close 0

# COPY / PASTE
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# TABS
map ctrl+shift+t     launch --type=tab --cwd=current
map ctrl+shift+q     close_tab
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab

# SPLITS
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+a     launch --location=vsplit --cwd=current
map ctrl+shift+w     close_window

# WINDOW NAVIGATION (VIM STYLE)
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+j neighboring_window down
map alt+k neighboring_window up

# RESIZE
map ctrl+alt+h resize_window narrower 5
map ctrl+alt+l resize_window wider    5
map ctrl+alt+j resize_window shorter  5
map ctrl+alt+k resize_window taller   5

# MISC
map ctrl+shift+n launch --cwd=current nvim
map ctrl+shift+r load_config_file
map ctrl+shift+k clear_terminal scrollback active
map ctrl+shift+d show_scrollback
